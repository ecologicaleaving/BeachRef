name: Build APK

on:
  push:
    branches: [master]
    paths:
      - 'beach_ref_flutter/lib/**'
      - 'beach_ref_flutter/pubspec.yaml'
      - 'beach_ref_flutter/pubspec.lock'
      - 'beach_ref_flutter/android/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: beach_ref_flutter
        run: flutter pub get

      - name: Build APK
        working-directory: beach_ref_flutter
        run: flutter build apk --release

      - name: Extract version
        id: version
        working-directory: beach_ref_flutter
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building v$VERSION"

      - name: Copy APK with version name
        run: |
          cp beach_ref_flutter/build/app/outputs/flutter-apk/app-release.apk \
             beachref-v${{ steps.version.outputs.version }}.apk

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: flutter-v${{ steps.version.outputs.version }}
          name: BeachRef Flutter v${{ steps.version.outputs.version }}
          files: beachref-v${{ steps.version.outputs.version }}.apk
          make_latest: true
          body: |
            Build automatica Flutter APK da CI.
            Commit: ${{ github.sha }}
