name: beach_ref_flutter
description: "BeachRef - Professional Beach Volleyball Referee App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.7.0
  xml: ^6.5.0
  connectivity_plus: ^6.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  freezed_annotation: any
  json_annotation: any
  supabase_flutter: ^2.8.0
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: any
  riverpod_generator: ^2.6.3
  freezed: any
  json_serializable: any

flutter:
  uses-material-design: true
