[build]
  publish = "dist"
  command = "npx expo export --platform web"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  # TEMPORARY: Force all browsers to clear cached resources for this origin
  # This purges the old 1-year cached JS bundles from users' browsers
  # TODO: Remove Clear-Site-Data header after 2026-04-01
  for = "/*"
  [headers.values]
    Clear-Site-Data = "\"cache\""

[[headers]]
  # index.html must NEVER be cached — this is how users get new deploys
  for = "/"
  [headers.values]
    cache-control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    cache-control = "no-cache, no-store, must-revalidate"

[[headers]]
  # Hashed static assets can be cached forever (filename changes on new deploy)
  for = "/static/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  # Hashed bundles from Expo export (e.g., /bundles/abc123.js)
  for = "/bundles/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  # Root-level assets: short cache with revalidation
  for = "/*.js"
  [headers.values]
    cache-control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    cache-control = "public, max-age=0, must-revalidate"