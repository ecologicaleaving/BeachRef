[build]
  publish = "dist"
  command = "npx expo export --platform web"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  # index.html must NEVER be cached — this is how users get new deploys
  for = "/"
  [headers.values]
    cache-control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    cache-control = "no-cache, no-store, must-revalidate"

[[headers]]
  # Hashed static assets can be cached forever (filename changes on new deploy)
  for = "/static/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  # Hashed bundles from Expo export (e.g., /bundles/abc123.js)
  for = "/bundles/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  # Code-split JS chunks from Expo web export (entry + per-route async chunks)
  # Filenames are content-hashed (e.g. /_expo/static/js/web/entry-<hash>.js),
  # so they can be cached forever — a new deploy always produces new hashes.
  for = "/_expo/static/js/web/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  # Root-level assets: short cache with revalidation
  for = "/*.js"
  [headers.values]
    cache-control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    cache-control = "public, max-age=0, must-revalidate"