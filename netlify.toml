[build]
  publish = "dist"
  command = "npx expo export --platform web"

[functions]
  directory = "netlify/functions"

# NOTE (issue #34): NO SPA catch-all rewrite to /index.html.
# With Expo `web.output: "static"` every route is prerendered to its own HTML
# (e.g. /tournament-selection → tournament-selection.html) with above-the-fold
# content already painted. A `/* -> /index.html 200` rewrite would serve the
# empty "Loading" splash for every URL, discarding all per-route prerendering
# and inflating LCP. Netlify serves the per-route HTML via pretty URLs; unknown
# paths fall back to Expo's generated 404 page.
[[redirects]]
  from = "/*"
  to = "/+not-found.html"
  status = 404

[[headers]]
  # index.html must NEVER be cached — this is how users get new deploys
  for = "/"
  [headers.values]
    cache-control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    cache-control = "no-cache, no-store, must-revalidate"

[[headers]]
  # Hashed static assets can be cached forever (filename changes on new deploy)
  for = "/static/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  # Hashed bundles from Expo export (e.g., /bundles/abc123.js)
  for = "/bundles/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  # Code-split JS chunks from Expo web export (entry + per-route async chunks)
  # Filenames are content-hashed (e.g. /_expo/static/js/web/entry-<hash>.js),
  # so they can be cached forever — a new deploy always produces new hashes.
  for = "/_expo/static/js/web/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  # Root-level assets: short cache with revalidation
  for = "/*.js"
  [headers.values]
    cache-control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    cache-control = "public, max-age=0, must-revalidate"