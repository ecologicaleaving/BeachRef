[build]
  publish = "dist"
  command = "npx expo export --platform web"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/static/*"
  [headers.values]
    cache-control = "max-age=31536000"

[[headers]]
  for = "/*.js"
  [headers.values]
    cache-control = "max-age=31536000"

[[headers]]
  for = "/*.css"
  [headers.values]
    cache-control = "max-age=31536000"