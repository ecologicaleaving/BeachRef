# Production Readiness Audit - GitHub Actions Workflow
# Copy this file to: .github/workflows/audit.yml

name: Production Readiness Audit

on:
  # Run on pull requests to main branches
  pull_request:
    branches:
      - master
      - main
      - development
    paths:
      - '**.ts'
      - '**.tsx'
      - '**.js'
      - '**.jsx'
      - 'package.json'
      - 'tsconfig.json'
      - '.eslintrc.js'

  # Run on pushes to main branches
  push:
    branches:
      - master
      - main
      - development

  # Allow manual triggering
  workflow_dispatch:

jobs:
  # Job 1: Code Quality (Fast - runs first)
  code-quality:
    name: Code Quality Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Code Quality Checks
        run: npm run audit -- --checks=quality --fail-on=critical,high

      - name: Upload Code Quality Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-quality-report
          path: specs/002-production-refactoring/reports/latest.md
          retention-days: 30

  # Job 2: Security Scan (Parallel with code quality)
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Security Scan
        run: npm run audit -- --checks=security --fail-on=critical,high

      - name: Upload Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: specs/002-production-refactoring/reports/latest.md
          retention-days: 30

  # Job 3: Full Audit (Runs after code quality passes)
  full-audit:
    name: Full Production Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [code-quality, security]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Full Audit
        run: npm run audit -- --checks=all --fail-on=critical,high

      - name: Upload Full Audit Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-audit-reports
          path: |
            specs/002-production-refactoring/reports/latest.json
            specs/002-production-refactoring/reports/latest.md
          retention-days: 90

      - name: Comment PR with Results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('specs/002-production-refactoring/reports/latest.md', 'utf8');

            // Get summary (first 500 lines)
            const summary = report.split('\n').slice(0, 500).join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.name,
              body: '## Production Readiness Audit Results\n\n' + summary + '\n\n[Full Report](../actions/runs/${{ github.run_id }})'
            });

  # Job 4: Deployment Gate (Only on main/master)
  deployment-gate:
    name: Deployment Approval Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [full-audit]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Strict Audit for Deployment
        run: npm run audit:ci

      - name: Deployment Approved
        run: echo "✅ All audits passed - deployment approved"
